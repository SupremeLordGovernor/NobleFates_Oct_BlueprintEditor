<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oct Graph Editor</title>
<style>
:root{--bg:#f3f3ef;--fg:#1d1d1b;--mu:#76766f;--bd:#d4d4cc;--ac:#3b6fd4;--card:#fff;--grid:#e2e2db;--dg:#c0392b;--ref:#8a8a82;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141517;--fg:#e8e8e3;--mu:#9a9a93;--bd:#34363a;--ac:#7aa2f0;--card:#1f2023;--grid:#212225;--dg:#ff7b6b;--ref:#8a8a92;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141517;--fg:#e8e8e3;--mu:#9a9a93;--bd:#34363a;--ac:#7aa2f0;--card:#1f2023;--grid:#212225;--dg:#ff7b6b;--ref:#8a8a92;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--bg);z-index:20}
h1{font-size:14px;margin:0 6px 0 0}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:3px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
label.ck{display:flex;gap:4px;align-items:center;color:var(--mu)}label.ck input{padding:0}
#status{margin-left:auto;color:var(--mu);font-size:12px}
#wrap{flex:1;display:flex;min-height:0}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;background-color:#161616;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px),linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:128px 128px,128px 128px,16px 16px,16px 16px;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.ov{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
path.e{fill:none;stroke-width:2.5;opacity:.92;stroke-linecap:round}
path.e.inherit{stroke:#fff;stroke-width:3}
path.e.own{stroke:#8a8a8a;stroke-dasharray:2 6;opacity:.6}
path.e.hi{stroke-width:4.5;opacity:1;filter:brightness(1.4) drop-shadow(0 0 4px #fff9)}
path.hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
#tmp{fill:none;stroke:#fff;stroke-width:3}
.node{position:absolute;width:max-content;min-width:260px;box-sizing:border-box;background:#1d1d1df0;border:1px solid #000;border-radius:7px;overflow:hidden;cursor:move;box-shadow:0 6px 14px #000a;color:#ddd}
.node.sel{outline:2px solid #f0a53a;outline-offset:1px}
.hd{height:30px;box-sizing:border-box;padding:3px 10px;color:#fff;line-height:1.15;border-bottom:1px solid #000;overflow:hidden}
.hd b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd i{display:block;font-style:normal;font-size:10px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{height:20px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#c8c8c8;padding:0 6px}
.pr span{display:flex;align-items:center;gap:6px}
.row{height:22px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:11px}
.row input{min-width:0;background:#0d0d0d;color:#e6e6e6;border:1px solid #333;border-radius:3px;padding:1px 4px;font:11px ui-monospace,Menlo,monospace;height:17px;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.row input.ik{width:84px;flex:none;color:#9bb;background:transparent;border-color:transparent}.row input.ik:focus{border-color:#555}
.row input.iv{flex:1}
.sm{flex:1;color:#8a8a8a;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree{border-top:1px solid #000;padding:3px 0 6px}
.tr{position:relative;min-height:22px;display:flex;align-items:center;gap:5px;font-size:11px;padding-right:6px}
.tr input,.tr textarea{min-width:0;background:#0d0d0d;color:#e6e6e6;border:1px solid #333;border-radius:3px;padding:1px 4px;font:11px ui-monospace,Menlo,monospace;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.tr input{height:17px}.tr textarea{flex:none;resize:vertical;line-height:1.35;white-space:pre}
.tr input.ik{flex:none;color:#9bb;background:transparent;border-color:transparent}.tr input.ik:focus{border-color:#555}
.tr input.iv{flex:none}.tr input.cm{color:#777;font-style:italic}
.tg{width:12px;flex:none;text-align:center;color:#aaa;cursor:pointer}
.tp{position:absolute;left:6px;top:5px;width:12px;height:12px;box-sizing:border-box;border:2px solid var(--c);border-radius:50%;background:var(--c)}
.ab{font-size:10px;padding:0 7px;background:#2a2a2a;color:#bbb;border-color:#000}
#mv{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#mvh{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd)}
#mvb{flex:1;display:flex;min-height:0}#mvl{width:290px;overflow:auto;border-right:1px solid var(--bd)}
.mi{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--bd)}.mi small{display:block;color:var(--mu);font-size:10px;word-break:break-all}.mi.on{background:var(--card)}
.lb{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;cursor:pointer}.lb:hover{border-color:var(--ac)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.ok{background:#4c4}.dot.ap{background:#ec4}.dot.no{background:#d54}
#mvc{flex:1;position:relative;min-width:0;background:#1a1a1a}#mvc canvas{display:block;width:100%;height:100%}
#mvi{position:absolute;left:10px;bottom:10px;color:#ddd;font-size:12px;background:#000a;padding:4px 8px;border-radius:6px;max-width:80%}
@media(max-width:700px){#mvb{flex-direction:column}#mvl{width:auto;height:30%;border-right:0;border-bottom:1px solid var(--bd)}}
.rx{width:14px;flex:none;color:#777;cursor:pointer;background:none!important;border:0!important;padding:0!important}.rx:hover{color:#f66}
.ft{height:24px;display:flex;align-items:center;padding:0 8px}.ft button{font-size:10px;padding:0 8px;background:#2a2a2a;color:#bbb;border-color:#000}
.pin{width:12px;height:12px;flex:none;cursor:crosshair;box-sizing:border-box}
.pin.ex{background:#fff;opacity:.45;clip-path:polygon(0 0,60% 0,100% 50%,60% 100%,0 100%)}.pin.ex.on{opacity:1}
.pin.rin{--c:#8bd;border:2px solid var(--c);border-radius:50%;cursor:default}.pin.rin.on{background:var(--c)}
.pin:hover{filter:brightness(1.6)}
#cm{position:fixed;z-index:50;display:none;background:#1b1b1b;border:1px solid #000;border-radius:6px;box-shadow:0 8px 20px #000a;color:#ddd;min-width:170px;padding:4px 0}
.ct{padding:4px 12px;font-size:11px;color:#888;text-transform:uppercase}.ci{padding:5px 12px;cursor:pointer}.ci:hover{background:#2f5fa8}
#side{width:340px;border-left:1px solid var(--bd);background:var(--bg);padding:10px;overflow:auto;box-sizing:border-box}
#side label{display:block;color:var(--mu);margin:10px 0 3px;font-size:12px}
#side input,#side textarea{width:100%;box-sizing:border-box;font-family:ui-monospace,Menlo,monospace;font-size:12px}
#side textarea{height:46vh}
.btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.dg{color:var(--dg)}
.legend{color:var(--mu);font-size:12px;margin-top:12px}
#srcp{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;padding:12px;gap:8px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
#srcp textarea{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:12px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mu);pointer-events:none}
@media(max-width:700px){#wrap{flex-direction:column}#side{width:auto;height:42%;border-left:0;border-top:1px solid var(--bd)}#side textarea{height:18vh}}
</style></head><body>
<header>
<h1>Oct Blueprint Editor</h1>
<button id="open">Open…</button><input id="file" type="file" hidden>
<button id="src">Source / import</button>
<select id="tpl"><option value="">+ New node…</option></select>
<button id="fit">Fit view</button><button id="lay">Auto layout</button>
<label class="ck"><input type="checkbox" id="ckR" checked>references</label>
<label class="ck"><input type="checkbox" id="ckN">nested objects</label>
<label class="ck"><input type="checkbox" id="ckO" checked>no overlap</label>
<button id="mvOpen">Model viewer</button><button id="copy">Copy</button><button id="save">Save</button><button id="sample">Sample</button>
<span id="status"></span>
</header>
<div id="wrap">
<div id="vp"><div id="world"><svg class="ov" id="edges"></svg><svg class="ov"><path id="tmp"/></svg><div id="nodes"></div></div><div id="empty">Open a file or load the sample to see the graph.</div></div>
<aside id="side"></aside>
</div>
<div id="mv"><div id="mvh"><b>Model viewer</b><button id="mvRoot" title="Choose the folder so the viewer can read the files">Browse…</button><input id="mvDir" type="file" webkitdirectory multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><select id="mvScope"><option value="sel">Selected node</option><option value="all">Whole document</option></select><select id="mvTex"><option value="auto">Texture: auto</option></select><button id="mvRef">Refresh</button><span id="mvSt" class="legend"></span><button id="mvX" style="margin-left:auto">Close</button></div><div id="mvb"><div id="mvl"></div><div id="mvc"><div id="mvi">Pick a model on the left. Click Browse… and choose your game folder so the files can be found.</div></div></div></div>
<div id="srcp"><div class="btns"><button id="sApply">Apply as graph</button><button id="sClose">Close</button></div><textarea id="sta" spellcheck="false"></textarea></div>
<script>
(()=>{
let uid=0,roots=[],nodes=[],byKey=new Map(),objKey=new Map(),edges=[],pos=new Map(),elOf=new Map(),sel=null,selE=null,fname='config.txt';
let tx=40,ty=40,sc=1;const W=260,H=76,PX=12,Y1=40,Y2=60;
const $=s=>document.querySelector(s);
const h=(t,p,...c)=>{const e=document.createElement(t);for(const k in p||{}){if(k==='class')e.className=p[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),p[k]);else e[k]=p[k]}for(const x of c.flat())if(x!=null)e.append(x.nodeType?x:document.createTextNode(x));return e};
const svgEl=(t,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e};
const raw=t=>({k:'r',t,id:++uid});

/* parser */
function parse(src){
  let i=0;const n=src.length;
  const ws=()=>{let b=0;while(i<n&&/\s/.test(src[i])){if(src[i]==='\n')b++;i++}return b};
  const sp=()=>{while(i<n&&(src[i]===' '||src[i]==='\t'))i++};
  const eol=()=>{const s=i;while(i<n&&src[i]!=='\n')i++;return src.slice(s,i).trim()};
  const com=()=>({k:'c',text:eol(),id:++uid});
  const val=()=>src[i]==='{'?obj(null):src[i]==='['?arr():raw(eol());
  function obj(sel){
    i++;const o={k:'o',sel,e:[],id:++uid};
    for(;;){
      const b=ws();if(i>=n)break;if(src[i]==='}'){i++;break}
      let e;
      if(src.startsWith('//',i))e=com();
      else{
        const s=i;while(i<n&&!/[\s=]/.test(src[i]))i++;
        const key=src.slice(s,i);if(!key){i++;continue}
        sp();
        if(src[i]==='='){i++;ws();e={k:'kv',key,op:'=',v:val()}}
        else{const t=eol();e=t?{k:'kv',key,op:' ',v:raw(t)}:{k:'kv',key,op:'',v:null}}
      }
      e.b=b>1?1:0;e.id=++uid;o.e.push(e);
    }
    return o;
  }
  function arr(){
    i++;const a={k:'a',e:[],id:++uid};
    for(;;){
      const b=ws();if(i>=n)break;if(src[i]===']'){i++;break}
      let it;
      if(src.startsWith('//',i))it=com();
      else if(src[i]==='{')it=obj(null);
      else if(src[i]==='?'){const s=i;while(i<n&&src[i]!=='{')i++;it=obj(src.slice(s,i).trim())}
      else it=raw(eol());
      it.b=b>1?1:0;a.e.push(it);
    }
    return a;
  }
  const out=[];
  for(;;){ws();if(i>=n)break;if(src[i]==='{')out.push(obj(null));else if(src.startsWith('//',i))out.push(com());else eol()}
  return out;
}
const IN='    ';
function sNode(x,d){
  const p=IN.repeat(d);
  if(x.k==='o'){let s=(x.sel?x.sel+' ':'')+'{\n';for(const e of x.e)s+=(e.b?'\n':'')+sEnt(e,d+1)+'\n';return s+p+'}'}
  if(x.k==='a'){let s='[\n';for(const e of x.e)s+=(e.b?'\n':'')+p+IN+(e.k==='c'?e.text:e.k==='r'?e.t:sNode(e,d+1))+'\n';return s+p+']'}
  return x.t;
}
function sEnt(e,d){
  const p=IN.repeat(d);
  if(e.k==='c')return p+e.text;
  if(!e.v)return p+e.key;
  if(e.op===' ')return p+e.key+' '+e.v.t;
  if(e.v.k==='r')return p+e.key+' = '+e.v.t;
  return p+e.key+' =\n'+p+sNode(e.v,d);
}
const serAll=()=>roots.map(n=>n.k==='c'?n.text:sNode(n,0)).join('\n')+'\n';
const gv=(o,k)=>{const e=o.e.find(x=>x.key===k&&x.v&&x.v.k==='r');return e&&e.v.t};

/* graph model */
function build(){
  nodes=[];byKey=new Map();objKey=new Map();edges=[];
  const first=new Map(),showN=$('#ckN').checked;
  const reg=(o,ctx)=>{const id=gv(o,'id');if(!id)return;let key=id,c=1;while(byKey.has(key))key=id+'#'+(++c);
    const nd={key,id,obj:o,...ctx};nodes.push(nd);byKey.set(key,nd);objKey.set(o,key);if(!first.has(id))first.set(id,key)};
  const walk=(x,ctx,top)=>{
    if(x.k==='o'){if(top||showN)reg(x,ctx);for(const e of x.e)if(e.k==='kv'&&e.v&&e.v.k!=='r')walk(e.v,{entry:e,parent:x},false)}
    else if(x.k==='a')for(const it of x.e)if(it.k==='o'||it.k==='a')walk(it,{list:x.e},false);
  };
  roots.forEach(o=>o.k==='o'&&walk(o,{list:roots},true));
  const seen=new Set();
  const add=(a,b,kind,ent)=>{if(!b||a===b)return;const k=a+'|'+b+'|'+kind+'|'+(ent?ent.join(','):'');if(seen.has(k))return;seen.add(k);edges.push({a,b,kind,ch:ent})};
  for(const nd of nodes){
    const w=(x,root,ch)=>{
      if(x.k==='o'){
        if(!root&&showN&&objKey.has(x)){add(nd.key,objKey.get(x),'own',ch);return}
        for(const e of x.e)if(e.k==='kv'&&e.v){if(e.key==='inherit'&&e.v.k==='r')add(nd.key,first.get(e.v.t),'inherit',ch.concat(e.id));else w(e.v,false,ch.concat(e.id))}
      }else if(x.k==='a')x.e.forEach(i=>w(i,false,ch.concat(i.id)));
      else if(x.k==='r'){const m=/^<(.+)>$/.exec(x.t);if(m)add(nd.key,first.get(m[1]),'ref',ch)}
    };
    w(nd.obj,true,[]);
  }
}
function layout(){
  const from=new Map(nodes.map(n=>[n.key,[]]));edges.forEach(e=>from.get(e.a).push(e.b));
  const depth=new Map(),vis=new Set();
  const d=k=>{if(depth.has(k))return depth.get(k);if(vis.has(k))return 0;vis.add(k);let m=-1;for(const t of from.get(k))m=Math.max(m,d(t));vis.delete(k);depth.set(k,m+1);return m+1};
  const cols={};nodes.forEach(n=>(cols[d(n.key)]??=[]).push(n));
  let slot=0;
  for(const c of Object.keys(cols).sort((a,b)=>a-b)){
    const list=cols[c].sort((a,b)=>a.id<b.id?-1:1);
    for(let s=0;s<list.length;s+=8,slot++){let y=0;list.slice(s,s+8).forEach(n=>{if(!pos.has(n.key))pos.set(n.key,{x:slot*(W+90),y});y+=geo(n).h+24})}
  }
}
const hue=t=>[...(t||'?')].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const SKIP=new Set(['id','type','inherit']);
function geo(n){
  const all=n.obj.e.filter(e=>e.k==='kv'&&!SKIP.has(e.key)),rows=all.slice(0,12).map((e,i)=>({e,y:61+i*22})),more=all.length-rows.length;
  const my=50+rows.length*22+11,fy=50+(rows.length+(more>0?1:0))*22;
  return{rows,more,my,h:fy+28};
}
function rowY(n,ent){const g=geo(n),r=ent&&g.rows.find(x=>x.e===ent);return r?r.y:(ent&&g.more>0?g.my:Y1)}
const isRef=t=>/^<.+>$/.test(t);
function rowsFor(n,ec){
  const g=geo(n),out=[];
  for(const r of g.rows){
    const e=r.e,v=e.v,ed=ec.get(e.id),c=ed?'hsl('+hue(gv(byKey.get(ed.b).obj,'type'))+' 70% 62%)':'#8bd';
    let val;
    if(!v)val=h('span',{class:'sm'},'(flag)');
    else if(v.k==='r'){let prev=v.t;val=h('input',{class:'iv',value:v.t,spellcheck:false,oninput:x=>{v.t=x.target.value},onchange:()=>{const was=isRef(prev);prev=v.t;if(was||isRef(v.t))rebuild(n.key);else if(sel===n.key)inspect()}})}
    else val=h('span',{class:'sm'},v.k==='a'?'['+v.e.length+'] · edit in inspector':'{…} · edit in inspector');
    out.push(h('div',{class:'row'},h('span',{class:'pin rin'+(ed?' on':''),style:'--c:'+c}),h('input',{class:'ik',value:e.key,spellcheck:false,oninput:x=>{e.key=x.target.value},onchange:()=>{if(sel===n.key)inspect()}}),val,h('button',{class:'rx',title:'Remove',onclick:()=>{n.obj.e.splice(n.obj.e.indexOf(e),1);rebuild(n.key)}},'×')));
  }
  if(g.more>0)out.push(h('div',{class:'row'},h('span',{class:'sm'},'+'+g.more+' more · select node to edit in inspector')));
  out.push(h('div',{class:'ft'},h('button',{onclick:()=>{n.obj.e.push({k:'kv',key:'newKey',op:'=',v:raw('value'),b:0,id:++uid});rebuild(n.key)}},'+ property')));
  return out;
}
const openT=new Set();
const rawOnly=a=>a.k==='a'&&a.e.length>0&&a.e.every(i=>i.k==='r'||i.k==='c');
function geo(n){return{h:60+Math.min(40,n.obj.e.length)*22+24}}
const nh=n=>{const el=elOf.get(n.key);return el?el.offsetHeight:geo(n).h};
function rowY(n,ch){const A=n.anch;if(A&&ch)for(let i=ch.length-1;i>=0;i--)if(A.has(ch[i]))return A.get(ch[i]);return Y1}
const nw=n=>{const el=elOf.get(n.key);return el?el.offsetWidth:W};
function separate(only){
  if(!$('#ckO').checked)return;
  const G=16,R=new Map(nodes.map(n=>[n.key,[nw(n),nh(n)]])),mv=new Set(),anc=sel&&byKey.get(sel),pairs=[];
  if(only){const m=byKey.get(only);if(!m)return;nodes.forEach(n=>{if(n!==m)pairs.push([n,m])})}
  else for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++)pairs.push([nodes[i],nodes[j]]);
  for(let it=0;it<40;it++){
    let moved=false;
    for(const[a,b]of pairs){
      const pa=pos.get(a.key),pb=pos.get(b.key),[aw,ah]=R.get(a.key),[bw,bh]=R.get(b.key);
      const ox=Math.min(pa.x+aw,pb.x+bw)-Math.max(pa.x,pb.x)+G,oy=Math.min(pa.y+ah,pb.y+bh)-Math.max(pa.y,pb.y)+G;
      if(ox<=0||oy<=0)continue;
      const m=only?b:(b===anc?a:b),fx=ox<=oy;
      const d=fx?(pb.x+bw/2)-(pa.x+aw/2):(pb.y+bh/2)-(pa.y+ah/2),s=(d>=0?1:-1)*(m===b?1:-1),p=m===b?pb:pa;
      if(fx)p.x+=s*ox;else p.y+=s*oy;
      mv.add(m.key);moved=true;
    }
    if(!moved)break;
  }
  mv.forEach(k=>{const el=elOf.get(k),p=pos.get(k);if(el){el.style.left=p.x+'px';el.style.top=p.y+'px'}});
}

      if(mt)tx.push({key:e.key,path:mt[1].trim()});
      else if(d<4){const r=/^<(.+)>$/.exec(t),id=r?r[1]:(e.key==='inherit'||e.key==='alias')?t:null,tg=id&&MV.ids.get(id);if(tg&&!seen.has(tg))q.push([tg,d+1])}}});}
  return tx;
}
function mvStat(){const f=MV.list.filter(m=>findFile(m.path)).length;$('#mvSt').textContent=(MV.url?'Root URL: '+MV.url:MV.root?'Root: '+MV.root+(MV.rp?' @ '+MV.rp:''):MV.rp?'Root path: '+MV.rp+' — click Browse… and choose that folder (a browser can’t read a typed path by itself)':'No files loaded')+' \u00b7 '+MV.n+' files \u00b7 '+f+'/'+MV.list.length+' models found'}
function mvIdx(){MV.ids=new Map();walkAll({k:'a',e:roots},o=>{const id=gv(o,'id');if(id&&!MV.ids.has(id))MV.ids.set(id,o)})}

  mvStat();
}
const loadLib=async()=>{if(MV.lib)return;
  for(const u of['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js'])
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('Could not load 3D library: '+u));document.head.append(s)});
  MV.lib=true};
function mvInit(){
  if(MV.t)return;const box=$('#mvc'),R=new THREE.WebGLRenderer({antialias:true});R.outputEncoding=THREE.sRGBEncoding;R.setClearColor(0x1a1a1a);box.prepend(R.domElement);
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.01,1000),ctl=new THREE.OrbitControls(cam,R.domElement),grp=new THREE.Group(),dl=new THREE.DirectionalLight(0xffffff,.9);
  dl.position.set(3,6,4);scene.add(grp,dl,new THREE.HemisphereLight(0xffffff,0x444455,1.1));cam.position.set(0,1,3);let grid=null;
  MV.t={R,scene,cam,ctl,grp,setGrid:(sz,y)=>{if(grid)scene.remove(grid);grid=new THREE.GridHelper(sz,20,0x555555,0x2c2c2c);grid.position.y=y;scene.add(grid)}};
  new ResizeObserver(()=>{const w=box.clientWidth,hh=box.clientHeight;if(!w||!hh)return;R.setSize(w,hh,false);cam.aspect=w/hh;cam.updateProjectionMatrix()}).observe(box);
}
function loop(){if(!MV.open)return;MV.t.ctl.update();MV.t.R.render(MV.t.scene,MV.t.cam);requestAnimationFrame(loop)}
function frame(o){const T=MV.t,b=new THREE.Box3().setFromObject(o),c=b.getCenter(new THREE.Vector3()),s=b.getSize(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z)||1;
  o.position.sub(c);T.cam.near=m/100;T.cam.far=m*100;T.cam.updateProjectionMatrix();T.cam.position.set(m*.9,m*.5,m*1.8);T.ctl.target.set(0,0,0);T.ctl.update();T.setGrid(m*3,-s.y/2)}
function texFor(p){if(!MV.tc.has(p))MV.tc.set(p,(async()=>{const r=await getFile(p);if(!r)return null;const bm=await createImageBitmap(r.f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t})().catch(()=>null));return MV.tc.get(p)}
async function applyTex(){
  const c=MV.cur;if(!c||!c.obj)return;const v=$('#mvTex').value;let alb=null,nrm=null;
  if(v==='auto'){const a=c.tx.find(t=>/albedo|maintex|basemap|diffuse|color/i.test(t.key))||c.tx.find(t=>!/normal|bump|height/i.test(t.key)),n=c.tx.find(t=>/normal|bump/i.test(t.key));alb=a?await texFor(a.path):null;nrm=n?await texFor(n.path):null}
  else if(v!=='none')alb=await texFor(v);
  c.obj.traverse(o=>{if(!o.isMesh)return;[].concat(o.material).forEach(mt=>{mt.map=alb;mt.normalMap=nrm;if(alb&&mt.color)mt.color.set(0xffffff);mt.side=THREE.DoubleSide;mt.needsUpdate=true})});
  info(MV.base+' \u00b7 '+(alb?'texture applied':v==='none'?'untextured':'no texture found (use Browse… to give access to your game folder)'));
}
async function showModel(m){
  const T=MV.t;if(!T)return;MV.cur={m,obj:null,tx:texturesFor(m)};mvList();
  const seen=new Set(),u=MV.cur.tx.filter(t=>!seen.has(t.path)&&seen.add(t.path));
  $('#mvTex').replaceChildren(h('option',{value:'auto'},'Texture: auto'),h('option',{value:'none'},'Texture: none'),...u.map(t=>h('option',{value:t.path},(findFile(t.path)?'\u2713 ':'\u2717 ')+t.path.split('/').pop())));
  T.grp.clear();const r=await getFile(m.path);
  if(!r){info(MV.err||('Not found: '+m.path+' \u2014 use Browse… to give the viewer access to your game folder.'));return}
  info('Loading '+m.name+'\u2026');
  try{const obj=new THREE.FBXLoader().parse(await r.f.arrayBuffer(),'');T.grp.add(obj);frame(obj);MV.cur.obj=obj;let tri=0;
    obj.traverse(o=>{if(o.isMesh)tri+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3});
    MV.base=m.name+' \u00b7 '+Math.round(tri)+' triangles';await applyTex()}
  catch(e){info('Could not read FBX: '+e.message)}
}
$('#mvOpen').onclick=async()=>{

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('octmv',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

async function loadH(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('h').objectStore('h').get('root');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(_){return null}}
async function walkDir(dh,pre,out){for await(const[nm,hd]of dh.entries()){if(hd.kind==='file'){if(/\.(fbx|png)$/i.test(nm)){const f=await hd.getFile();f._rp=pre+nm;out.push(f)}}else await walkDir(hd,pre+nm+'/',out)}}
async function useDir(dh){
  $('#mvSt').textContent='Reading \u201c'+dh.name+'\u201d\u2026';const out=[];await walkDir(dh,dh.name+'/',out);
  MV.files.clear();MV.tc.clear();MV.root=dh.name;MV.n=0;MV.pending=null;addFiles(out);saveH(dh);mvList();if(MV.cur)showModel(MV.cur.m);
}
async function restoreDir(){
  if(MV.n||MV.url||!window.indexedDB)return;const hd=await loadH();if(!hd)return;
  try{if(await hd.queryPermission({mode:'read'})==='granted')await useDir(hd);else{MV.pending=hd;$('#mvSt').textContent='Click Browse\u2026 to reconnect \u201c'+hd.name+'\u201d'}}catch(_){}
}
